<head>
    <meta charset="utf-8" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="icon" type="image/svg+xml" href="./img/icon.svg" sizes="any" />
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico" sizes="48x48" />
    <script type="module" charset="utf-8" src="js/bundle.js"></script>
    <title>Colnet</title>
</head>

<body class="bg-clr-3">
    <main id="app">
        <article id="settings" class="page">
        </article>
        <article id="schedule" class="page">
        </article>
        <article id="home" class="page">
        </article>
        <article id="replacements" class="page"></article>
        <article id="news" class="page">
            <div class="card m-2 card-bg-clr-4">
                <div class="card-body">
                    <h5 class="card-title">Вітаю в Colnet</h5>
                    <h6 class="card-subtitle mb-2 text-body-secondary">
                        <q>Краще попереду</q>
                    </h6>
                    <p class="card-text">
                        Пізніше тут з'являтимуться повідомлення, але наразі будьте
                        спокійні
                    </p>
                </div>
            </div>
        </article>
        <dialog id="registration" class="position-fixed bg-transparent glass z-3 w-auto h-100 border-0 p-2">
            <div class="border border-2 p-3 rounded-4 bg-clr-5 bd-clr-1 h-100 w-100">
                <h3 class="text-center">Налаштування</h3>
                <p class="text-secondary">
                    Налаштуйте деякі моменти для правильної роботи сайту
                </p>
                <form id="start_settings" class="needs-validation">
                    <label for="group_select">Виберіть свою групу</label>
                    <select id="group_select" name="group">
                        <option selected disabled value="">Група</option>
                    </select>
                    <div id="subject_link">
                        <h4>Виберіть посилання на свої пари</h4>
                    </div>
                    <input id="set_ready" type="submit" value="Готово" disabled />
                </form>
            </div>
        </dialog>
        <div class="modal fade" id="removeAllData" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
            aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="staticBackdropLabel">Очистити всі данні</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Після очищення данні буде неможливо відновити
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
                        <button id="cleanData" type="button" class="btn btn-danger">Очистити</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <nav id="navbar">
        <ul class="list-unstyled m-2">
            <li>
                <a id="settings_link" href="#settings"><img src="./img/settings.svg" alt="Налаштування" /></a>
            </li>
            <li>
                <a id="schedule_link" href="#schedule"><img src="./img/schedule.svg" alt="Розклад" /></a>
            </li>
            <li>
                <a id="home_link" href="#home"><img src="./img/home.svg" alt="Домашня сторінка" /></a>
            </li>
            <li>
                <a id="replacements_link" href="#replacements"><img src="./img/replacements.svg" alt="Заміни" /></a>
            </li>
            <li>
                <a id="news_link" href="#news"><img src="./img/news.svg" alt="Новини" /></a>
            </li>
        </ul>
    </nav>
</body>

</html>
